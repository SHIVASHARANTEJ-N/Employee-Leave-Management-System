<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: grid;
            place-items: center;
            font-family: 'Inter', sans-serif;
        }
        .admin{
            display: flex;
            flex-direction: column;
            width: 400px;
            background: rgba(255, 255, 255, 0.1);  /* Semi-transparent background */
            backdrop-filter: blur(10px);     
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            justify-content: center;
            align-items: center;
            color: white;
            align-items: flex;
            margin-top: 10px;
            padding: 25px;
        }
        input{
            width: 95%;
            height: 25px;
            border: none;
            margin-top: 10px;
            border-radius: 4px;
            background: none;
            border: 1px white solid;
            font-size: 1em;
            color: whitesmoke;
        }
        a{
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: end;
            text-decoration: none;
            color: #b3e0ff; 
            text-decoration: none; 
            font-weight: 600; 
            transition: color 0.3s ease; 
        }
        button{
            text-align: center;
            background-color: chartreuse;
            border: none;
            height: 35px;
            border-radius: 20px;
            width: 95%;
        }
        input[type=checkbox]{
            width: 30px;
            height: 10px;
        }
        button:hover{
            background-color:  rgb(13, 167, 214);
            color: black;
            cursor: pointer;
        }
        a:hover {
            color: #ffffff; 
            text-decoration: underline; 
        }
        p {
                font-size: 1.2em; 
        }
        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: rgba(255, 255, 255, 0.7); 
            background: rgba(255, 255, 255, 0.2); 
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5); 
        }
    </style>
</head>
<body>
    
    <div class="admin">
        <a href="main.html">Back To Home</a> 
        <h2 style="font-size: 2.3em;">Admin Login</h2>
        <p style="margin-top: -3%;">Access your administrator account</p>
         <form>
            <input type="email" placeholder="Enter Your Email ID"> 
            <input type="password" placeholder="Enter Your Password">
            <pre><input type="checkbox">Rember Me     <a href="" style="margin-top: -5%;">ForgotPassword</a></pre>
            <button>Sign In</button>
            <pre>Don't have an Account?  <a href="signadmin.html" style="margin-top: -5%;">Sign up here</a></pre>
         </form>
    </div>
</body>
</html>
